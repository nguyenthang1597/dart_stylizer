name: Dart CI and Release

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  build:
    name: Build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ''
          - os: windows-latest
            platform: windows
            extension: '.exe'
          - os: macos-latest
            platform: macos
            extension: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Compile and smoke-test executable
        shell: bash
        run: |
          binary="dist/dart_stylizer-${{ matrix.platform }}-${{ runner.arch }}${{ matrix.extension }}"
          dart run tool/build_binary.dart "$binary"
          "./$binary" --help

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: dart-stylizer-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/dart_stylizer-${{ matrix.platform }}-${{ runner.arch }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4

      - name: Download platform executables
        uses: actions/download-artifact@v4
        with:
          pattern: dart-stylizer-*
          path: release-assets
          merge-multiple: true

      - name: Include install scripts
        run: cp scripts/install.sh scripts/install.ps1 release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum dart_stylizer-* install.sh install.ps1 > SHA256SUMS

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
